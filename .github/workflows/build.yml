name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --bins --locked
      - name: Verify Bash cd and interactive less
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tests/shell_cd.bash "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/target/release"
          python3 tests/less_pty.py "$GITHUB_WORKSPACE/target/release/less" "$GITHUB_WORKSPACE/README.md"
      - name: Collect commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ext=""
          if [[ "$RUNNER_OS" == Windows ]]; then ext=".exe"; fi
          # The registry is the single source of truth for the command list.
          while IFS= read -r name; do
            [[ -z "$name" || "$name" == "[" ]] && continue
            if [[ "$RUNNER_OS" == Windows && "$name" == "link" ]]; then continue; fi
            cp "target/release/$name$ext" artifacts/
          done < <("target/release/agentcmd$ext" --list)
          # "[" is the test utility under another name; it is copied only once test exists.
          if [[ -f "target/release/test$ext" ]]; then
            cp "target/release/test$ext" "artifacts/[$ext"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-commands-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
  gnu-diff:
    # Pinned: ubuntu-latest moves to Ubuntu 26 and would change the GNU versions compared.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GNU reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk tree xxd dos2unix patch bsdextrautils
      - name: GNU differential tests
        env:
          AGENTCMD_GNU_DIFF: "1"
        run: cargo test --locked --test gnu_diff
