name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --bins --locked
      - name: Verify Bash cd and interactive less
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tests/shell_cd.bash "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/target/release"
          python3 tests/less_pty.py "$GITHUB_WORKSPACE/target/release/less" "$GITHUB_WORKSPACE/README.md"
      - name: Collect commands
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ "$RUNNER_OS" == Windows ]]; then cp target/release/agentcmd.exe artifacts/; else cp target/release/agentcmd artifacts/; fi
          while IFS= read -r name; do
            [[ "$name" == "[" ]] && continue
            if [[ "$RUNNER_OS" == Windows ]]; then
              cp "target/release/$name.exe" artifacts/
            else
              cp "target/release/$name" artifacts/
            fi
          done < <(target/release/agentcmd --list)
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp artifacts/test.exe "artifacts/[.exe"
          else
            ln -s test "artifacts/["
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-commands-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
  gnu-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y gawk tree xxd dos2unix patch bsdextrautils
      - run: AGENTCMD_GNU_DIFF=1 cargo test --locked --test gnu_diff
