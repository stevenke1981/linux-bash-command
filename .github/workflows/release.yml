name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Commit, branch or tag to build (a matching version tag when publishing)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release (requires a matching version tag)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read

env:
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source and version
        id: source
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z "$version" ]]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true && "v$version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then
            tag_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
            if [[ "$tag_sha" != "$(git rev-parse HEAD)" ]]; then
              echo "Publication tag does not identify the prepared source commit" >&2
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  package:
    needs: prepare
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-latest
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo build --release --bins --locked
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\package.ps1 -BinaryDirectory .\target\release -StageDirectory .\dist\windows-x86_64 -OutputDirectory .\dist
      - name: Stage Unix commands
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="dist/${{ matrix.name }}"
          mkdir -p "$stage"
          cp target/release/agentcmd "$stage/"
          while IFS= read -r name; do
            [[ "$name" == "[" ]] && continue
            cp "target/release/$name" "$stage/"
          done < <(target/release/agentcmd --list)
          ln -s test "$stage/["
          cp README.md LICENSE NOTICE.md "$stage/"
          mkdir -p "$stage/shell"
          cp shell/* "$stage/shell/"
          ls "$stage"
      - name: Build Inno Setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $default = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (-not (Test-Path $default)) {
              choco install innosetup -y --no-progress
            }
            $iscc = $default
          } else {
            $iscc = $iscc.Source
          }
          & $iscc "/DAppVersion=$env:VERSION" packaging\agent-commands.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist\Agent-Commands-$env:VERSION-Windows-Setup.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'agent-commands-install'
          $installer = Start-Process -Wait -PassThru -WindowStyle Hidden -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir"
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)" }
          $commands = @(& "$dir\agentcmd.exe" --list)
          if ($LASTEXITCODE -ne 0) { throw "agentcmd --list failed with code $LASTEXITCODE" }
          if ($commands.Count -ne 115) { throw "Expected 115 commands, got $($commands.Count)" }
          foreach ($name in @('[', 'awk', 'gzip', 'link', 'sed', 'tar', 'test', 'whoami', 'zcat')) {
            if ($commands -cnotcontains $name) { throw "Missing registry command: $name" }
          }
          $commands | Select-Object -First 3
          $versionLines = @(& "$dir\agentcmd.exe" --version)
          if ($LASTEXITCODE -ne 0) { throw "agentcmd --version failed with code $LASTEXITCODE" }
          if ($versionLines.Count -ne 1 -or $versionLines[0] -cne "agentcmd $env:VERSION (multi-call binary)") {
            throw "Unexpected agentcmd version: $versionLines"
          }
          $count = @('hi' | & "$dir\wc.exe" -l)
          if ($LASTEXITCODE -ne 0) { throw "wc -l failed with code $LASTEXITCODE" }
          if ($count.Count -ne 1 -or $count[0].Trim() -cne '1') { throw "Unexpected wc -l output: $count" }
      - name: Archive Unix commands
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          base="agent-commands-$VERSION-${{ matrix.name }}"
          tar -czf "$base.tar.gz" -C "${{ matrix.name }}" .
          ls -la
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-platform-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-Setup.exe
          if-no-files-found: error
  bundle:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          pattern: release-platform-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          overwrite: true
          path: assets/*
          if-no-files-found: error
  publish:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Agent Commands $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
