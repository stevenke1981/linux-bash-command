[package]
name = "agentcmd"
version = "0.2.0"
edition = "2021"
description = "Cross-platform command-line tools for coding agents"
license = "MIT"

[dependencies]
crossterm = "0.28"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ignore = "0.4"
grep-cli = "0.1"
regex = "1"
serde_json = "1"
similar = "2"
filetime = "0.2.29"
jiff = { version = "0.2.45", features = ["tzdb-bundle-always"] }
rand = "0.10.3"
sha1 = "0.11.0"
sha2 = "0.11.1"
md-5 = "0.11.0"
blake2 = "0.11.0"

flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
tar = "0.4.46"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
