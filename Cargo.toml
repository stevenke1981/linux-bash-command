[package]
name = "agentcmd"
version = "0.1.0"
edition = "2021"
description = "Cross-platform command-line tools for coding agents"
license = "MIT"

[dependencies]
crossterm = "0.28"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ignore = "0.4"
grep-cli = "0.1"
regex = "1"
serde_json = "1"
similar = "2"
